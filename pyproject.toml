[project]
name = "phyloscreen"
version = "1.0.0"
description = "Predict bacterial phenotypes (e.g. antimicrobial resistance) from genome assemblies using Mash screen and logistic regression"
authors = [{ name = "Janar Aava", email = "janar.aava@ut.ee" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13,<4"
keywords = ["bioinformatics", "mash", "phenotype-prediction", "antimicrobial-resistance", "genomics"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "typer>=0.21",
    "rich>=14",
    "pandas>=3.0",
    "numpy>=2.0",
    "scikit-learn>=1.8",
    "joblib>=1.3",
]

[project.urls]
Homepage = "https://github.com/bioinfo-ut/PhyloScreen"
Repository = "https://github.com/bioinfo-ut/PhyloScreen"
Issues = "https://github.com/bioinfo-ut/PhyloScreen/issues"

[project.scripts]
phyloscreen = "phyloscreen.cli:app"

[tool.poetry]
packages = [{ include = "phyloscreen" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
