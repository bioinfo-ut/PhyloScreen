name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: ci
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          create-args: >-
            python=3.13
            mash>=2.3
            pip
          cache-environment: true

      - name: Install package and test dependencies
        run: pip install . pytest

      - name: Run tests
        run: pytest -v

      - name: CLI smoke test
        run: |
          phyloscreen --version
          phyloscreen --help
          mash --version
